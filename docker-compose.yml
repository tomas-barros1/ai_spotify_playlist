services:
  app:
    build: .
    image: ai_spotify_playlist
    # Required for the interactive terminal menu
    stdin_open: true
    tty: true
    # Map port 8888 so the Spotify OAuth2 callback (from your host browser)
    # reaches the container's local TCPServer
    ports:
      - "8888:8888"
    # Load credentials from .env file (never committed to git)
    env_file:
      - .env
    volumes:
      # Mount .env as writable so the app can persist the refresh token
      - ./.env:/app/.env
